Homology_BMQs:
  title: In Search of Homology for Quasigroups of Bol-Moufang Type
  coauthors: Anthony Christiana, Huizheng (Ali) Guo, Jinseok Oh, Józef H. Przytycki, Anna Zamojska-Dzienio
  abstract: We initiate (co)homology theory for quasigroups of Bol-Moufang type based on analysis of their extensions by affine quasigroups of the same type. We use these extensions to define second and third boundary operators $\partial_2(x,y)$ and $\partial_3(x,y,z)$, respectively. We use these definition to compute the second homology groups for several examples from the work of Phillips and Vojtěchovský. We speculate about the relation between these homology groups and those obtained from a small category with coefficients in a functor. 
  arXiv_date: 08/28/25
  arXiv_link: https://arxiv.org/abs/2508.21268
  journal: n/a
  pub_year: n/a
  journal_link: n/a

Colorings_SUs_Partial_Knots:
  title: Colorings of symmetric unions and partial knots
  coauthors: Zongzheng Dai, Gabriel Diraviam, Kareem Jaber, Krishnendu Kar, Ziyun Liu, Teo Miklethun, Haritha Nagampoozhy, Michael Perry, Moses Samuelson-Lynn, Eli Seamans, Ana Wright, Nicole Xie, Ruiqi Zou, and Alexander Zupan
  abstract: Motivated by work of Kinoshita and Terasaka, Lamm introduced the notion of a symmetric union, which can be constructed from a partial knot $J$ by introducing additional crossings to a diagram of $J \# -J$ along its axis of symmetry. If both $J$ and $J'$ are partial knots for different summetric union presentations of the same ribbon knot $K$, the knots $J$ and $J'$ are said to be symmetrically related. Lamm proved that if $J$ and $J'$ are summetrically related, then $\det J = \det J'$, asking whether the converse is true. In this article, we give a negative answer to Lamm's question, constructing for any natural number $m$ a family of $2^m$ knots with the same determinant but such that no two knots in the family are symmetrically related. This result is a corollary to our main theorem, that if $J$ is the partial knot in a symmetric union presentation for $K$, then $\col_p(J) \leq \col_p(K) \leq \frac{(\col_p(J))^2}{p}$, where $\col_p(\cdot)$ denotes the number of $p$-colorings of a knot.
  arXiv_date: 04/11/25
  arXiv_link: https://arxiv.org/abs/2504.08589
  journal: n/a
  pub_year: n/a
  journal_link: n/a  

Low_Dim_YB_Homology:
  title: Low Dimensional Homology of the Yang-Baxter Operators Yielding the HOMFLYPT Polynomial
  coauthors: Anthony Christiana, Huizheng (Ali) Guo, Jinseok Oh, Józef H. Przytycki, Xiao Wang, and Hongdae Yun
  abstract: Homology of Yang-Baxter operators were introduced independently by Victoria Lebed and Józef Przytycki in 2012. We analyze the homology of the Yang-Baxter Operators $R_{(m)}$ yielding the HOMFLYPT polynomial, reducing the computation of the $n$-th homology of $R_{(m)}$ for arbitrary $m$ to the computation of $n+1$ initial conditions. We then produce the explicit formulas for the third and fourth homology.
  arXiv_date: 02/28/25
  arXiv_link: https://arxiv.org/abs/2502.20659
  journal: n/a
  pub_date: n/a 
  journal_link: n/a